name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests (stdlib only, no deps to install)
        run: python -m unittest discover -s tests -v
      - name: demo script still matches its captured output
        run: |
          cd examples
          sh run-demo.sh > /tmp/demo-out.txt 2>&1
          diff -u expected-output.txt /tmp/demo-out.txt
          rm -f sample.gguf
